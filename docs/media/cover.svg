<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Pi Studio — от идеи к результату</title>
  <desc id="desc">Графитовая типографика, жёлтый акцент и абстрактные листы результатов. Локальная студия для команд агентов Pi.</desc>
