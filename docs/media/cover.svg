    <text x="72" y="77" font-size="17" font-weight="700" letter-spacing="2.8" fill="#71717a">СОБЕРИТЕ СВОЮ КОМАНДУ</text>
    <text x="66" y="205" font-size="112" font-weight="800" letter-spacing="-5" fill="#171719">PI STUDIO</text>
    <text x="72" y="278" font-size="43" font-weight="600" letter-spacing="-1" fill="#171719">От идеи к результату.</text>
    <text x="72" y="325" font-size="27" fill="#71717a">Промпты, инструменты и файлы — в одном месте.</text>
    <path d="M72 391H865" stroke="#cfcfce"/>
    <text x="72" y="430" font-size="18" fill="#171719">Выбираете модель. Запускаете агента. Смотрите результат.</text>
    <text x="72" y="478" font-size="18" font-weight="700" letter-spacing="1.2" fill="#71717a">macOS · ALPHA</text>
    <text x="439" y="478" font-size="18" font-weight="700" letter-spacing="1.2" fill="#71717a">ФАЙЛЫ НА ВАШЕМ ДИСКЕ</text>
