  <g clip-path="url(#bounds)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1440" height="520" fill="#f6f6f4"/>
    <path d="M1048 -80H1515V625H912Z" fill="#ffe23b"/>
    <g fill="none" stroke="#171719" stroke-width="3">
      <path d="M1040 -20v90M1160 -20v90M1280 -20v90M1400 -20v90"/>
    </g>
    <g transform="translate(1068 115) rotate(12)">
      <rect x="36" y="5" width="220" height="278" rx="6" fill="#171719"/>
      <rect x="-28" y="37" width="220" height="278" rx="6" fill="#fff"/>
      <rect x="-86" y="74" width="220" height="278" rx="6" fill="#ffe23b" stroke="#171719" stroke-width="3"/>
      <text x="-60" y="135" fill="#171719" font-size="24" font-weight="700">03</text>
      <path d="M-60 160H107M-60 180H107M-60 200H49" stroke="#171719" stroke-width="3"/>
      <circle cx="43" cy="279" r="45" fill="#171719"/>
